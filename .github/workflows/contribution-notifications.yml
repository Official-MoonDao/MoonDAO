name: Contribution Discord Notifications

# Contributions are submitted through an external Google Form, so there's no
# server-side hook on submit. This cron polls the deployed site, which diffs the
# contributions sheet against rows already announced and posts new ones to
# Discord. Dedup state lives in Upstash Redis, so polling is idempotent.
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger contribution notification poller
        env:
          SITE_URL: ${{ secrets.MOONDAO_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Apex moondao.com 307s to www.moondao.com with a "Redirecting..." body.
          # curl does not follow redirects unless -L is set, and -f does not treat
          # 307 as failure, so a poll of the apex exits 0 without calling the
          # notifier. A cross-host -L redirect would also drop Authorization.
          # Post straight to www. An empty MOONDAO_SITE_URL used to select the apex.
          BASE="${SITE_URL:-https://www.moondao.com}"
          BASE="${BASE%/}"
          case "$BASE" in
            http://moondao.com|https://moondao.com)
              BASE="https://www.moondao.com"
              ;;
          esac
          response=$(curl -fsS -X POST "$BASE/api/cron/contribution-notifications" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json")
          echo "$response"
          case "$response" in
            *'"ok":true'*|*'"ok": true'*) ;;
            *)
              echo "Contribution notifier did not succeed" >&2
              exit 1
              ;;
          esac
