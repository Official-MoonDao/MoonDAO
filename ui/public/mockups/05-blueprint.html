<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MoonDAO — Direction 05 · Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #101318;
    --ink-2: #565d67;
    --ink-3: #949aa3;
    --hair: #dfe1e4;
    --paper: #fcfcfa;
    --draft: #1f4e79;
    --grid: rgba(16,19,24,0.045);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  a { color: inherit; text-decoration: none; }
  .m {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  }

  .sheet {
    max-width: 1160px; margin: 0 auto;
    background: rgba(252,252,250,0.88);
    border-left: 1px solid var(--hair); border-right: 1px solid var(--hair);
    position: relative;
  }
  .pad { padding: 0 56px; }

  .reg { position: absolute; width: 16px; height: 16px; }
  .reg::before, .reg::after { content: ''; position: absolute; background: var(--ink-3); }
  .reg::before { left: 0; top: 7.5px; width: 16px; height: 1px; }
  .reg::after { top: 0; left: 7.5px; width: 1px; height: 16px; }
  .reg.tl { top: 18px; left: 18px; } .reg.tr { top: 18px; right: 18px; }
  .reg.bl { bottom: 18px; left: 18px; } .reg.br { bottom: 18px; right: 18px; }

  .titleblock {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; border-bottom: 1px solid var(--ink);
    position: sticky; top: 0; z-index: 30;
    background: rgba(252,252,250,0.94); backdrop-filter: blur(6px);
  }
  .mark { font-weight: 600; font-size: 14px; letter-spacing: 0.04em; }
  .titleblock nav { display: flex; gap: 24px; }
  .titleblock nav a { font-size: 13px; color: var(--ink-2); }
  .titleblock nav a:hover { color: var(--draft); }
  .titleblock .join { color: var(--draft); font-size: 13px; font-weight: 500; }

  .hero { padding: 72px 0 0; }
  .hero h1 {
    margin: 0; font-size: clamp(34px, 4.8vw, 60px); font-weight: 500;
    line-height: 1.04; letter-spacing: -0.032em; max-width: 14ch;
  }
  .hero h1 .thin { color: var(--ink-3); font-weight: 400; }
  .cta-row { margin-top: 32px; }
  .btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    display: inline-flex; align-items: center; height: 38px; padding: 0 16px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  }
  .btn:hover { background: var(--draft); border-color: var(--draft); color: #fff; }

  .diagram { padding: 48px 0 64px; }
  .diagram svg { width: 100%; height: auto; display: block; }

  .legend {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
  }
  .legend > div { padding: 20px 0; border-right: 1px solid var(--hair); }
  .legend > div:last-child { border-right: 0; }
  .legend .v {
    display: block; margin-top: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: -0.02em;
    text-transform: none; color: var(--ink);
  }

  .close { padding: 72px 0 88px; }
  .close h2 { margin: 0; font-size: clamp(26px, 3.4vw, 40px); font-weight: 500; letter-spacing: -0.03em; }

  footer {
    border-top: 1px solid var(--hair); padding: 20px 0 36px;
    display: flex; justify-content: space-between;
  }

  @media (max-width: 800px) {
    .pad { padding: 0 24px; }
    .titleblock nav { display: none; }
    .legend { grid-template-columns: 1fr; }
    .legend > div { border-right: 0; border-bottom: 1px solid var(--hair); }
  }
</style>
</head>
<body>

<div class="sheet">
  <span class="reg tl"></span><span class="reg tr"></span>
  <span class="reg bl"></span><span class="reg br"></span>

  <div class="pad">
    <div class="titleblock">
      <a class="mark" href="#">MOONDAO</a>
      <nav>
        <a href="#">Missions</a>
        <a href="#">Governance</a>
        <a href="#">About</a>
      </nav>
      <a class="join" href="#">Join</a>
    </div>

    <div class="hero">
      <h1>A space program, <span class="thin">drawn in public.</span></h1>
      <div class="cta-row"><a class="btn" href="#">Join</a></div>
    </div>

    <div class="diagram">
      <svg viewBox="0 0 820 300" role="img" aria-label="Earth to Moon, 2021 to 2025">
        <defs>
          <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#1f4e79" stroke-width="0.6" opacity="0.35"/>
          </pattern>
        </defs>
        <line x1="40" y1="268" x2="780" y2="268" stroke="#949aa3" stroke-width="1"/>
        <circle cx="120" cy="170" r="50" fill="url(#hatch)" stroke="#101318" stroke-width="1.1"/>
        <text x="120" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#565d67" letter-spacing="1">EARTH</text>
        <path d="M170 170 C 310 56, 530 56, 678 152" fill="none" stroke="#1f4e79" stroke-width="1.1" stroke-dasharray="5 4"/>
        <g font-family="JetBrains Mono, monospace" font-size="9" fill="#565d67" letter-spacing="1">
          <circle cx="290" cy="90" r="3" fill="#1f4e79"/>
          <text x="290" y="76" text-anchor="middle">2021 · FOUNDED</text>
          <circle cx="420" cy="68" r="3" fill="#1f4e79"/>
          <text x="420" y="54" text-anchor="middle">2022 · COTTON</text>
          <circle cx="550" cy="88" r="3" fill="#1f4e79"/>
          <text x="550" y="74" text-anchor="middle">2024 · JAHANGIR</text>
          <circle cx="650" cy="128" r="3" fill="#1f4e79"/>
          <line x1="650" y1="125" x2="650" y2="104" stroke="#949aa3" stroke-width="0.8"/>
          <text x="650" y="96" text-anchor="middle">2025 · CHARTER</text>
        </g>
        <circle cx="700" cy="170" r="26" fill="none" stroke="#101318" stroke-width="1.1"/>
        <text x="700" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#565d67" letter-spacing="1">MOON</text>
      </svg>
    </div>

    <div class="legend">
      <div><span class="m">Flown</span><span class="v">2</span></div>
      <div><span class="m">Raised</span><span class="v">$8M</span></div>
      <div><span class="m">Landed</span><span class="v">2025</span></div>
    </div>

    <div class="close">
      <h2>Membership is open.</h2>
      <div class="cta-row"><a class="btn" href="#">Join</a></div>
    </div>

    <footer>
      <span class="m">© MoonDAO</span>
      <span class="m">Privacy</span>
    </footer>
  </div>
</div>

</body>
</html>
