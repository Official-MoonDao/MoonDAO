<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MoonDAO — Direction 20 · Mat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #1a1713; --dim: #6a645a; --mat: #efe8dc; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--mat); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  .nav {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 32px 0;
    font-size: 13px;
  }
  .nav .mark { font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-style: italic; }
  .nav a { color: var(--dim); }

  .stage {
    min-height: calc(100vh - 64px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 36px 48px 48px;
  }
  figure { margin: 0 auto; max-width: 1080px; width: 100%; }
  figure img {
    display: block; width: 100%; height: min(68vh, 720px);
    object-fit: cover; object-position: center 62%;
    box-shadow: 0 1px 0 rgba(26,23,19,0.06);
  }
  figcaption {
    display: flex; justify-content: space-between; gap: 24px;
    margin-top: 16px; color: var(--dim); font-size: 13px;
  }
  figcaption em { font-family: 'Newsreader', Georgia, serif; font-style: italic; color: var(--ink); font-size: 16px; }

  .after {
    max-width: 1080px; margin: 0 auto 88px; padding: 0 48px;
    display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px;
    border-top: 1px solid rgba(26,23,19,0.14); padding-top: 36px;
  }
  .after h1 {
    margin: 0; font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(28px, 3.4vw, 42px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
  }
  .after p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.55; }
  .after .join {
    display: inline-block; margin-top: 18px;
    border-bottom: 1px solid var(--ink); padding-bottom: 2px; font-size: 14px;
  }

  @media (max-width: 800px) {
    .stage { padding: 24px 20px 32px; }
    figure img { height: 56vh; }
    .after { grid-template-columns: 1fr; padding: 28px 20px 64px; gap: 20px; }
  }
</style>
</head>
<body>

<div class="nav">
  <span class="mark">MoonDAO</span>
  <a href="#">Join</a>
</div>

<div class="stage">
  <figure>
    <img src="/assets/coby-cotton.png" alt="MoonDAO members standing with a flag in front of a rocket" />
    <figcaption>
      <em>The members. West Texas.</em>
      <span>A civic organization that sent two people to space.</span>
    </figcaption>
  </figure>
</div>

<div class="after">
  <h1>No space company would publish this photograph. That is why it is the site.</h1>
  <div>
    <p>Coby Cotton, 2022, by vote. Dr. Eiman Jahangir, 2024, by sweepstakes. A constitution written by the members, on the Moon, 2025. Eight million dollars still on the ledger.</p>
    <a class="join" href="#">Join</a>
  </div>
</div>

</body>
</html>
